# GEM4XE.CFG -- what gem4xe should do before it has a screen.
#
# One KEY=VALUE a line.  '#' or ';' starts a comment; case does not
# matter; a key or value gem4xe does not know is ignored, never refused.
# No file, or every line commented out, is the common machine -- which
# is what this is.  Boot to the DOS prompt to change a line.

# VIDEO -- which screen.  AUTO: the VBXE if fitted, else ANTIC.
#   VBXE: 640x240, sixteen colours; refuses to start without one.
#   ANTIC (or SAFE): 320x168, two colours, EVEN IF there is a VBXE --
#   the way out when the display is blank, rolling or out of range.
# VIDEO=AUTO

# MOUSE -- the pointer on the joystick ports.  AUTO is an ST mouse.
#   ST, AMIGA, TRAKBALL (CX80), TABLET (CX77 or KoalaPad; KOALA works),
#   XEM1 (mouSTer; MOUSTER works), NONE (the keyboard only).
# MOUSE=AUTO

# CLOCK -- where the time comes from.  AUTO: the chip on an Ultimate
#   1MB or a SIDE, else whatever clock the DOS knows.  DOS: the DOS only.
#   NONE: midnight, 1 January 1980 -- try it if the machine stops before
#   the boot screen.
# CLOCK=AUTO

# SCREENH -- how many of the VBXE's 240 lines to show: 240, 224 or 200.
# TOPMARGIN -- blank lines above the picture, 0 to 32.
#   Both for a television that cuts the top or bottom off: SCREENH makes
#   the picture shorter, TOPMARGIN moves it down.  Try 224 first.
# SCREENH=240
# TOPMARGIN=0

# PRINTER -- what a page is written in: NONE, PCL (a laser printer, or
#   Altirra's 825) or PS (PostScript, best to a file).  NONE never waits.
# PRINTTO -- where it goes: P:, or a filename.
# PRINTER=NONE
# PRINTTO=P:

# GEM4XE.CFG -- what gem4xe should do before it has a screen.
#
# Everything else is set from the desktop.  This is the one thing that
# cannot be, because it decides WHAT THE SCREEN IS, and a machine whose
# monitor will not take the VBXE's output has no screen to put a dialog
# on.  So it lives here, in plain text, where a DOS text editor can
# reach it -- boot to the DOS prompt and change a line.
#
# A line is KEY=VALUE.  '#' or ';' starts a comment.  Case does not
# matter.  A key or a value gem4xe does not know is IGNORED, never
# refused: a typo here must not be able to stop the machine starting.
#
# No file at all is the same as this one with everything commented out,
# which is what it is.  The common machine needs nothing here.

# VIDEO -- which screen.
#
#   AUTO    the VBXE if the machine has one, ANTIC if not.  The default.
#   VBXE    640x240, sixteen colours.  Refuses to start without one.
#   ANTIC   320x168, two colours, on Atari's condensed 6x6 face, EVEN IF
#           there is a VBXE.  This is the safe mode: use it if the
#           display is blank, rolling or out of range with AUTO.
#   SAFE    the same as ANTIC.
#
# There is one VBXE mode today -- 640x240 in sixteen colours -- so VIDEO
# names a screen rather than a resolution.  If more are added they get
# names here and this file keeps working: a value gem4xe does not know is
# ignored, so a file written for a later one still boots this one.
#
# VIDEO=AUTO

# MOUSE -- the pointing device on the joystick ports.
#
#   AUTO      an ST mouse, which is what a GEM machine has.  The default.
#   ST        Atari ST mouse
#   AMIGA     Amiga mouse (the same idea, a different pin order)
#   TRAKBALL  Atari CX80 trak-ball, in trak-ball mode
#   TABLET    Atari CX77 touch tablet or a KoalaPad (KOALA also works)
#   XEM1      mouSTer in XEM1 mode (MOUSTER also works)
#   NONE      no pointer.  The keyboard only.
#
# MOUSE=AUTO

# CLOCK -- where the time comes from.
#
#   AUTO    the clock chip on an Ultimate 1MB or a SIDE, and when there
#           is neither, whatever clock the DOS knows (SpartaDOS X: an
#           IDE Plus 2, an R-Time 8, a FujiNet...).  The default.
#   DOS     ask the DOS only, even where there is a chip.
#   NONE    no clock: every time is midnight, 1 January 1980.  Try this
#           if the machine stops before the boot screen.
#
# CLOCK=AUTO
